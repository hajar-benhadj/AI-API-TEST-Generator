[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-api-test-gen"
version = "0.1.0"
description = "Turn Swagger/OpenAPI specs into ready-to-run pytest suites."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hajar Benhadj" }]
keywords = ["pytest", "openapi", "swagger", "testing", "api", "test-generation", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "requests>=2.28",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = ["pytest>=7.0"]

[project.scripts]
ai-api-test-gen = "ai_api_test_gen.cli:main"

[project.urls]
Homepage = "https://github.com/hajar-benhadj/AI-API-TEST-Generator"
Issues = "https://github.com/hajar-benhadj/AI-API-TEST-Generator/issues"

[tool.setuptools.packages.find]
where = ["src"]
