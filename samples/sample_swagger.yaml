openapi: 3.0.0
info:
  title: Sample Task API
  version: 1.0.0
paths:
  /tasks:
    get:
      summary: Get all tasks
      responses:
        "200":
          description: Successful response
    post:
      summary: Create a new task
      responses:
        "201":
          description: Task created
  /tasks/{id}:
    get:
      summary: Get a single task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
        "404":
          description: Task not found
